<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  @font-face { font-family:'Space Grotesk'; src:url('assets/fonts/space-grotesk-latin.woff2') format('woff2'); font-weight:300 700; }
  @font-face { font-family:'JetBrains Mono'; src:url('assets/fonts/jetbrains-mono-latin.woff2') format('woff2'); font-weight:400 600; }
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#06090a; color:#e7f1ec; font-family:'Space Grotesk',sans-serif; position:relative; overflow:hidden; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(94,234,180,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,180,0.05) 1px,transparent 1px); background-size:60px 60px; }
  .glow { position:absolute; inset:0; background:radial-gradient(50% 55% at 75% 40%, rgba(52,211,153,0.16), transparent 70%), radial-gradient(35% 40% at 15% 85%, rgba(94,234,212,0.08), transparent 70%); }
  .dot { position:absolute; width:8px; height:8px; border-radius:50%; background:#34d399; box-shadow:0 0 24px 6px rgba(52,211,153,0.5); }
  .inner { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 90px; }
  .brand { font-family:'JetBrains Mono',monospace; font-size:26px; color:#34d399; margin-bottom:28px; }
  h1 { font-size:88px; font-weight:700; letter-spacing:-0.03em; line-height:1.02; max-width:14ch; }
  .accent { background:linear-gradient(100deg,#34d399,#5eead4); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:26px; font-size:26px; color:#8fa69c; }
  .url { position:absolute; bottom:44px; left:90px; font-family:'JetBrains Mono',monospace; font-size:22px; color:#5d7268; }
</style></head><body>
  <div class="grid"></div><div class="glow"></div>
  <div class="dot" style="top:120px;right:180px"></div>
  <div class="dot" style="top:300px;right:90px;width:5px;height:5px"></div>
  <div class="dot" style="top:80px;right:340px;width:6px;height:6px;opacity:0.7"></div>
  <div class="dot" style="top:460px;right:260px;width:4px;height:4px;opacity:0.6"></div>
  <div class="inner">
    <p class="brand">&gt;_ a dev with purpose</p>
    <h1>AI agents that do <span class="accent">real work</span>.</h1>
    <p class="sub">Memory systems &middot; automations &middot; agent tooling</p>
  </div>
  <p class="url">adevwithpurpose.com</p>
</body></html>
